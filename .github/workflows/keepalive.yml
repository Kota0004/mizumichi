# スケジュール実行が止まらないようにする。
#
# GitHub は public リポジトリで60日間動きがないと、スケジュール実行を
# 自動的に無効化する。防災アプリが「気づかないうちに止まっていた」のは困るので、
# 月に1度、稼働記録を更新して活動があることにする。
name: 稼働の維持

on:
  schedule:
    - cron: "0 3 1 * *"     # 毎月1日
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 稼働記録を更新する
        run: |
          mkdir -p data
          date -u "+%Y-%m-%d %H:%M UTC 自動更新が動いています" \
            > data/heartbeat.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/heartbeat.txt
          git diff --staged --quiet || git commit -m "稼働記録を更新"
          git push
